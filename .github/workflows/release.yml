name: Release

# Tag vX.Y.Z buduje paczkę. Bez sekretów CF_API_KEY i WAGO_API_TOKEN oraz ID projektów w TOC
# powstaje tylko wydanie na GitHubie.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag musi wskazywać commit z main
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Tag musi zgadzać się z wersją w TOC
        run: |
          grep -qx "## Version: ${GITHUB_REF_NAME#v}" <(tr -d '\r' < addon/ClearWeek.toc)

      - name: Changelog tylko dla tej wersji
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v}" 'BEGIN{f=0} {sub(/\r$/,"")} $0==head{f=1;next} f && /^## /{exit} f{print}' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
          cp /tmp/notes.md CHANGELOG.md

      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
